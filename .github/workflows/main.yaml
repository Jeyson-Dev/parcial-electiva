name: Deploy to surge.sh

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install surge
        run: npm install --global surge

      - name: Deploy
        run: surge ./ primer-parcial-electiva-jeyson.surge.sh --token ${{ secrets.SURGE_TOKEN }}
